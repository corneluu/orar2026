function openNotifs() {
  const N_KEY = "orar:notifs";
  let n = Object.assign({
    email: "mcornel1178@gmail.com",
    phone: "0771569557",
    telegramBotToken: "",
    telegramChatId: "",
    notifyTelegram: true,
    notifyEmail: true,
    timing: [15, 30],
    morningSummary: true
  }, S.notifications || {});

  try {
    const ls = JSON.parse(localStorage.getItem(N_KEY) || "{}");
    n = Object.assign(n, ls);
  } catch(e) {}

  openModal((box, close) => {
    function saveN() {
      S.notifications = { ...n };
      changed();
      try { localStorage.setItem(N_KEY, JSON.stringify(n)); } catch(e) {}
    }

    function mkToggle(id, checked, onChange) {
      const wrap = h("label", { class: "toggle-wrap" });
      const inp = h("input", { type: "checkbox" });
      inp.id = id;
      inp.checked = !!checked;
      inp.onchange = e => onChange(e.target.checked);
      const slider = h("span", { class: "toggle-slider" });
      wrap.append(inp, slider);
      return wrap;
    }

    function mkTimingChip(mins, label) {
      const active = n.timing.includes(mins);
      const btn = h("button", {
        class: "quick-dur-btn",
        onclick() {
          if (n.timing.includes(mins)) {
            n.timing = n.timing.filter(x => x !== mins);
          } else {
            n.timing = [...n.timing, mins].sort((a,b) => a - b);
          }
          saveN(); draw();
        }
      }, label);
      if (active) {
        btn.style.cssText = "background:var(--accent);color:var(--on-accent);border-color:var(--accent);";
      }
      return btn;
    }

    let feedbackEl = null;
    function setFeedback(container, state, text) {
      if (feedbackEl && feedbackEl.parentNode) feedbackEl.remove();
      feedbackEl = h("span", { class: "test-feedback " + state }, text);
      container.append(feedbackEl);
    }

    async function testTelegram(btn) {
      const token = (n.telegramBotToken || "").trim();
      const chatId = (n.telegramChatId || "").trim();
      if (!token || !chatId) {
        setFeedback(btn.parentNode, "error", "Introdu Bot Token și Chat ID mai întâi.");
        return;
      }
      btn.disabled = true;
      setFeedback(btn.parentNode, "loading", "Se trimite...");
      try {
        const res = await fetch("https://api.telegram.org/bot" + token + "/sendMessage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: chatId,
            text: "<b>Test Orar – Telegram funcționează!</b>\n\nSistemul de notificări a fost configurat cu succes. Vei primi remindere automate pentru evenimentele tale!\n\n<a href=\"https://corneluu.github.io/orar2026/\">Deschide Orarul Meu</a>",
            parse_mode: "HTML"
          })
        });
        const r = await res.json();
        if (!r.ok) throw new Error(r.description);
        setFeedback(btn.parentNode, "success", "Mesaj Telegram trimis cu succes!");
      } catch(err) {
        setFeedback(btn.parentNode, "error", "Eroare: " + err.message);
      }
      btn.disabled = false;
    }

    async function testEmail(btn) {
      const email = (n.email || "").trim();
      if (!email) { setFeedback(btn.parentNode, "error", "Introdu adresa de email mai întâi."); return; }
      if (!ghToken) {
        setFeedback(btn.parentNode, "error", "Conectează-te la GitHub mai întâi (butonul din header).");
        return;
      }
      btn.disabled = true;
      setFeedback(btn.parentNode, "loading", "Se declanșează prin GitHub Actions...");
      try {
        saveN();
        const res = await fetch(
          "https://api.github.com/repos/corneluu/orar2026/actions/workflows/reminders.yml/dispatches",
          {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + ghToken,
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ ref: "main", inputs: { test_mode: "true" } })
          }
        );
        if (res.status === 204 || res.ok) {
          setFeedback(btn.parentNode, "success", "Trimis! Verifică emailul în ~30-60 secunde.");
        } else {
          const r = await res.json().catch(() => ({ message: "HTTP " + res.status }));
          throw new Error(r.message);
        }
      } catch(err) {
        setFeedback(btn.parentNode, "error", "Eroare: " + err.message);
      }
      btn.disabled = false;
    }

    function draw() {
      feedbackEl = null;
      const hasTg = !!(n.telegramBotToken && n.telegramChatId);
      const hasEmail = !!n.email;

      const headEl = h("div", { class: "sheet-head-pro" },

      );

      // Telegram section
      const tgBtn = h("button", { class: "btn", style: "font-size:12.5px;" }, "Trimite test Telegram");
      tgBtn.onclick = () => testTelegram(tgBtn);
      const tgFeedbackRow = h("div", { style: "display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;" }, tgBtn);

            h("span", { class: "notif-badge " + (n.notifyTelegram && hasTg ? "active" : "muted") },

            mkToggle("tg-on", n.notifyTelegram, v => { n.notifyTelegram = v; saveN(); draw(); })

        ),

            oninput: e => { n.telegramBotToken = e.target.value.trim(); saveN(); }
          })
        ),
        h("div", { class: "fld", style: "margin-top:8px;" },
          h("label", { class: "lab" }, "Chat ID"),
          h("input", {
            class: "inp", type: "text",
            placeholder: "123456789",
            value: n.telegramChatId || "",
            oninput: e => { n.telegramChatId = e.target.value.trim(); saveN(); }
          })
        ),
        tgFeedbackRow,
        h("details", { class: "notif-guide" },
          h("summary", null, "Cum obții Bot Token și Chat ID?"),
          h("ol", { style: "font-size:12px;color:var(--ink2);margin:8px 0 0;padding-left:18px;line-height:2;" },
            h("li", null, "Deschide Telegram, caută @BotFather și trimite /newbot"),
            h("li", null, "Copiază Bot Token-ul primit"),
            h("li", null, "Trimite orice mesaj botului nou creat"),
            h("li", null, "Caută @userinfobot → trimite /start → copiază Id:")
          )
        )
      );

      // Email section
      const emailBtn = h("button", { class: "btn", style: "font-size:12.5px;" }, "Trimite test Email");
      emailBtn.onclick = () => testEmail(emailBtn);
      const emailFeedbackRow = h("div", { style: "display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;" }, emailBtn);

      const emailSection = h("div", { class: "notif-card", style: "margin-bottom:14px;" },
        h("div", { class: "notif-card-header" },
          h("div", { style: "display:flex;align-items:center;gap:8px;" },
            h("span", { style: "font-size:20px;" }, "✉️"),
            h("div", null,
              h("div", { style: "font-weight:700;font-size:14px;" }, "Email"),
              h("div", { style: "font-size:12px;color:var(--ink3);" }, hasEmail ? n.email : "Adaugă adresa")
            )
          ),
          h("div", { style: "display:flex;align-items:center;gap:8px;" },
            h("span", { class: "notif-badge " + (n.notifyEmail && hasEmail ? "active" : "muted") },
              n.notifyEmail && hasEmail ? "ACTIV" : "INACTIV"),
            mkToggle("email-on", n.notifyEmail, v => { n.notifyEmail = v; saveN(); draw(); })
          )
        ),
        h("div", { class: "fld", style: "margin-top:12px;" },
          h("label", { class: "lab" }, "Adresa Email"),
          h("input", {
            class: "inp", type: "email",
            placeholder: "adresa@gmail.com",
            value: n.email || "",
            oninput: e => { n.email = e.target.value.trim(); saveN(); }
          })
        ),
        h("div", { class: "fld", style: "margin-top:8px;" },
          h("label", { class: "lab" }, "Resend API Key"),
          h("input", {
            class: "inp", type: "password",
            placeholder: "re_xxxxxxxxxxxxxxxxxxxxxxxx",
            value: n.resendApiKey || "",
            oninput: e => { n.resendApiKey = e.target.value.trim(); saveN(); }
          }),
          h("p", { style: "font-size:11.5px;color:var(--ink3);margin:4px 0 0;" },
            "Obții gratuit de la resend.com (100 emailuri/zi). Stocată doar pe acest dispozitiv."
          )
        ),
        emailFeedbackRow,
        h("details", { class: "notif-guide" },
          h("summary", null, "Cum configurezi Email-ul?"),
          h("p", { style: "font-size:12px;color:var(--ink2);margin:8px 0 0;line-height:1.8;" },
            "Email-ul se trimite prin GitHub Actions (gratuit). Mergi la resend.com → înregistrează-te → copiază API Key → adaugă-l ca GitHub Secret cu numele RESEND_API_KEY."
          )
        )
      );

      // Timing section
      const timingSection = h("div", { class: "notif-card", style: "margin-bottom:14px;" },
        h("div", { style: "font-weight:700;font-size:14px;margin-bottom:10px;" }, "Când să primești remindere?"),
        h("div", { style: "display:flex;flex-wrap:wrap;gap:8px;" },
          mkTimingChip(10, "10 min"),
          mkTimingChip(15, "15 min"),
          mkTimingChip(30, "30 min"),
          mkTimingChip(60, "1 ora"),
          mkTimingChip(120, "2 ore")
        ),
        h("div", { class: "notif-card-header", style: "margin-top:14px;" },
          h("div", null,
            h("div", { style: "font-weight:700;font-size:13.5px;" }, "Sumar dimineața (08:00)"),

        )
      );

      // Secrets info section
      const secretsSection = h("div", { class: "notif-card" },
        h("div", { style: "font-weight:700;font-size:14px;margin-bottom:8px;" }, "GitHub Secrets (backend automat)"),
        h("p", { style: "font-size:12px;color:var(--ink2);margin:0 0 8px;line-height:1.7;" },
          "Adaugă aceste secrete la: github.com → orar2026 → Settings → Secrets & Variables → Actions"
        ),
        h("div", { style: "background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;font-family:monospace;line-height:2;color:var(--ink2);" },
          h("div", null, "TELEGRAM_BOT_TOKEN"),
          h("div", null, "TELEGRAM_CHAT_ID"),
          h("div", null, "RESEND_API_KEY"),
          h("div", null, "NOTIFICATION_EMAIL = mcornel1178@gmail.com")
        )
      );

      const bodyEl = h("div", { class: "sheet-body" },
        tgSection, emailSection, timingSection, secretsSection
      );

      const footEl = h("div", { class: "sheet-foot" },
        h("span", { style: "flex:1;font-size:11px;color:var(--ink3);" }, "Setările se salvează automat"),
        h("button", { class: "btn", onclick: close }, "Închide")
      );

      box.replaceChildren(headEl, bodyEl, footEl);
    }
    draw();
  });
}

/* ==========================================================================
   EVENT LISTENERS & APP INITIALIZATION
   ========================================================================== */
$("#prev").onclick = () => nav(-1);
$("#next").onclick = () => nav(1);
$("#today").onclick = () => { ui.cursor = iso(new Date()); render(); };

for (const b of $("#views").children) {
  b.onclick = () => {
    ui.view = b.dataset.v;
    saveUi();
    render();
  };
}

$("#zin").onclick = () => { ui.hh = Math.min(140, ui.hh + 12); saveUi(); render(); };
$("#zout").onclick = () => { ui.hh = Math.max(28, ui.hh - 12); saveUi(); render(); };
$("#add").onclick = () => openEditor({ date: ui.view === "month" ? iso(new Date()) : ui.cursor });
$("#cats").onclick = openCats;
$("#notifs").onclick = openNotifs;
$("#settings").onclick = openSettings;

/* ==========================================================================
   MOBILE SWIPE GESTURES (LEFT / RIGHT TO NAVIGATE MONTH / WEEK / DAY)
   ========================================================================== */
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let touchStartScrollLeft = 0;
let isTouchActive = false;

window.addEventListener("touchstart", e => {
  // Only handle single-finger touch
  if (!e.touches || e.touches.length !== 1) {
    isTouchActive = false;
    return;
  }
  // Ignore if modal dialog, color picker, or prompt is open
  if (document.querySelector(".ov") || activePicker) {
    isTouchActive = false;
    return;
  }

  const target = e.target;
  // Ignore if tapping on buttons, form controls or interactive chips
  if (target.closest("button, input, textarea, select, .slider, .toggle-wrap, .color-btn, .more-pill, .sheet-close-btn")) {
    isTouchActive = false;
    return;
  }

  // Ensure touch is inside calendar view or header/controls area
  const inMain = target.closest("#main");
  const inNav = target.closest(".controls-bar, .top-header, #totals");
  if (!inMain && !inNav) {
    isTouchActive = false;
    return;
  }

  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchStartTime = Date.now();

  const gw = document.querySelector(".gw");
  touchStartScrollLeft = gw ? gw.scrollLeft : 0;
  isTouchActive = true;
}, { passive: true });

window.addEventListener("touchend", e => {
  if (!isTouchActive) return;
  isTouchActive = false;

  if (!e.changedTouches || e.changedTouches.length === 0) return;
  if (document.querySelector(".ov") || activePicker) return;

  const touch = e.changedTouches[0];
  const deltaX = touch.clientX - touchStartX;
  const deltaY = touch.clientY - touchStartY;
  const elapsed = Date.now() - touchStartTime;

  // Swipe gesture validation
  if (elapsed > 650) return; // took too long (slow scroll/drag)
  if (Math.abs(deltaX) < 42) return; // distance too short
  if (Math.abs(deltaX) <= Math.abs(deltaY) * 1.3) return; // predominantly vertical movement

  const target = e.target;
  const inNav = target.closest(".controls-bar, .top-header, #totals, .corner, .dh");
  const gw = document.querySelector(".gw");

  // In week view, if grid has horizontal overflow, only change week at the edges
  if (!inNav && gw && ui.view === "week" && gw.scrollWidth > gw.clientWidth + 20) {
    if (deltaX < 0) {
      // Swiping left -> next week, requires starting near right edge
      const atRight = touchStartScrollLeft + gw.clientWidth >= gw.scrollWidth - 32;
      if (!atRight) return;
    } else {
      // Swiping right -> prev week, requires starting near left edge
      const atLeft = touchStartScrollLeft <= 32;
      if (!atLeft) return;
    }
  }

  // Swipe Left (deltaX < 0) -> Next month/week/day
  // Swipe Right (deltaX > 0) -> Previous month/week/day
  if (deltaX < 0) {
    nav(1);
  } else {
    nav(-1);
  }
}, { passive: true });

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});

// Initial boot
render();
if (ghToken) loadFromGitHub();
else setStatus("local");

// Background sync every 60s
setInterval(() => {
  if (ghToken && !dirty && !saving) loadFromGitHub();
}, 60000);

})();
</script>
