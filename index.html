/* ==========================================================================

:root {

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0D1116;
  --surface: #151A21;
  --surface2: #1B2129;
  --surface3: #262D37;
  --ink: #E8ECF1;
  --ink2: #AEB7C2;
  --ink3: #8E98A5;
  --line: #2B333E;
  --line2: #212831;
  --accent: #4FC3CF;
  --accent-ink: #8DDCE4;
  --accent-soft: #12363C;
  --on-accent: #052226;
  --danger: #F2877C;

/* ==========================================================================
   BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { accent-color: var(--accent); caret-color: var(--accent); scrollbar-color: var(--line) transparent; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

button { cursor: pointer; }

.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tnum { font-variant-numeric: tabular-nums; }

/* ==========================================================================
   HEADER, TABS, PERIOD BAR
   ========================================================================== */
.top {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 2px;

  padding: var(--safe-t) max(6px, env(safe-area-inset-right, 0px)) 0 var(--gut-l);

}
.top.scrolled { border-bottom-color: var(--line); }

.ttl { flex: 1; min-width: 0; padding: 6px 0; }

}

}

.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  height: calc(var(--tabh) + var(--safe-b));
  padding: 0 env(safe-area-inset-right, 0px) var(--safe-b) env(safe-area-inset-left, 0px);
  background: var(--surface);

}
.tabs button {

  font-size: 13px;

}
.tic {
  position: relative;

  place-items: center;
  width: 56px;
  height: 30px;
  border-radius: 15px;
  transition: background 0.2s var(--ease);
}
.tabs button[aria-current="page"] { color: var(--accent-ink); }
.tabs button[aria-current="page"] .tic { background: var(--accent-soft); }
.tabs button.warn .tic::after {
  content: "";
  position: absolute;
  top: 3px;
  right: 14px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--danger);
}

.pbar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px));
}
.pbar .grow { flex: 1; }
.pnow {
  min-height: 44px;
  padding: 0 14px;

}
.pnow:disabled { color: var(--ink2); background: transparent; border-color: transparent; cursor: default; }

main {
  padding: 4px var(--gut-r) calc(var(--tabh) + var(--safe-b) + 96px) var(--gut-l);
}
body[data-view="day"] main { padding-bottom: calc(var(--tabh) + var(--safe-b) + 16px); }

/* ==========================================================================
   BUTTONS & SMALL PARTS
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;

.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-ink); }

.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:active:not(:disabled), .ib:active:not(:disabled) { transform: scale(0.97); }

@media (hover: hover) {
  .ib:hover:not(:disabled) { background: var(--surface3); }
  .btn:hover:not(:disabled) { background: var(--surface2); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
  .btn.ghost:hover:not(:disabled) { background: var(--accent-soft); }
  .btn.danger.solid:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 86%, var(--ink)); }
  .tabs button:hover { color: var(--ink); }

.h-stat .ic { width: 18px; height: 18px; }

.swipe { position: relative; border-radius: 12px; overflow: hidden; touch-action: pan-y; }

async function saveToGitHub(retry) {
  if (!ghToken || !dirty) return;
  if (saving) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveToGitHub(), 300);
    return;
  }
  saving = true;
  dirty = false;
  const content = utf8ToB64(JSON.stringify(S));
  const body = { message: "sync: update calendar data", content, sha: fileSha || undefined };
  try {
    const res = await fetch(GH_API, { method: "PUT", headers: ghHeaders(), body: JSON.stringify(body) });
    if (!res.ok) {
      const e = await res.json().catch(() => ({ message: "HTTP " + res.status }));
      throw new Error(e.message);
    }
    const json = await res.json();
    fileSha = json.content.sha;
    saving = false;
    setStatus(dirty ? "saving" : "saved");
  } catch (err) {
    saving = false;
    if (!retry) {
      dirty = true;
      setTimeout(() => saveToGitHub(true), 2000);
      return;
    }
    setStatus("error", "Eroare salvare");
  }
  if (dirty) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveToGitHub(), 300);
  }
}

  try { localStorage.setItem("orar:data", JSON.stringify(S)); } catch (e) {}
}

  persistLocal();
  render();
  if (!ghToken) { setStatus("local"); return; }
  dirty = true;
  setStatus("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveToGitHub(), 600);
}

    const cols = [];

      for (let i = 0; i < cols.length; i++) {
        if (cols[i] <= ev.s) { cols[i] = ev.e; ev.col = i; placed = true; break; }

      if (!placed) { ev.col = cols.length; cols.push(ev.e); }

        h("div", { class: "fld" }, h("label", { class: "lab", for: "f-note" }, "Notițe"),
          h("textarea", { id: "f-note", class: "inp", placeholder: "Ce ai de pregătit, materiale, detalii utile", value: f.note, oninput: e => { f.note = e.target.value; } })),
        h("div", { class: "fld" },
          h("label", { class: "sw-row" },
            h("span", null, h("b", null, "Reminder"), h("small", null, f.remindEnabled ? `Cu ${remLong(f.remindMins)} înainte, pe Telegram și email` : "Dezactivat")),
            sw(f.remindEnabled, v => { f.remindEnabled = v; draw(); }, "Reminder")),
          f.remindEnabled ? h("div", { class: "chips", style: "margin-top:4px" },
            ...presets.map(m => h("button", { class: "chip-btn", "aria-pressed": String(f.remindMins === m), onclick: () => { f.remindMins = m; draw(); } }, remLong(m)))) : null,
          f.remindEnabled ? h("div", { style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px" },
            h("span", { class: "lab", style: "margin:0" }, "Sau:"), numIn, unitSel, h("span", { class: "lab", style: "margin:0" }, "înainte (max 7 zile)")) : null)));

      // 5. Done state
      if (!isNew) {
        const dt = parse(f.date);
        kids.push(h("div", { class: "grp" }, h("label", { class: "sw-row" },
          h("span", null, h("b", null, "Făcut"), h("small", null, `Pentru ${dt.getDate()} ${MS[dt.getMonth()]}`)),
          sw(f.done, v => { f.done = v; }, "Marchează ca făcut"))));
      }
      if (f.err) kids.push(h("p", { class: "err-msg", role: "alert" }, f.err));

      bodyEl = h("div", { class: "sh-body" }, ...kids);

      let foot;
      if (f.asking) {
        foot = h("div", { class: "sh-foot" },
          h("p", { class: "q" }, "Aplici modificarea la:"),
          h("div", { class: "two" },
            h("button", { class: "btn primary", onclick: () => commit("this") }, "Doar azi"),
            h("button", { class: "btn primary", onclick: () => commit("all") }, "Toată seria")),
          h("button", { class: "btn ghost", onclick: () => { f.asking = false; draw(); } }, "Înapoi la editare"));
      } else if (f.deleting) {
        foot = h("div", { class: "sh-foot" },
          h("p", { class: "q" }, isRec ? "Ce ștergi din serie?" : "Ștergi evenimentul?"),
          ...(isRec ? delScopeButtons(del) : [h("button", { class: "btn danger solid block", onclick: () => del("all") }, "Da, șterge")]),
          h("button", { class: "btn ghost", onclick: () => { f.deleting = false; draw(); } }, "Renunță"));
      } else {
        foot = h("div", { class: "sh-foot" }, h("button", { class: "btn primary block", onclick: save }, ic("check"), "Salvează"));
      }

      box.replaceChildren(
        h("div", { class: "sh-head tight" },
          closeBtn(close),
          h("h2", { class: "sh-title" }, isNew ? "Eveniment nou" : "Editează"),
          !isNew ? h("button", { class: "ib danger", "aria-label": "Șterge evenimentul", onclick: () => { f.deleting = true; f.asking = false; draw(); } }, ic("trash")) : null),
        bodyEl, foot);
      bodyEl.scrollTop = keep;
      after.forEach(fn => fn());
    }

    function del(sc) {
      close();
      act(sc === "this" ? "Șters pentru " + shortDate(f.date) : "Eveniment șters", () => deleteOcc(base, occ, sc, f.date));
    }

    function save() {
      if (!f.start || !f.end || toMin(f.end) <= toMin(f.start)) { f.err = "Ora de final trebuie să fie după ora de început."; draw(); return; }
      if (f.repeat && (!f.days || !f.days.length)) { f.err = "Alege cel puțin o zi din săptămână."; draw(); return; }
      if (f.repeat && f.until && f.until < f.from) { f.err = "Data de final e înaintea datei de început."; draw(); return; }
      f.err = "";
      if (!isRec) return commit("all");
      const recChanged = snapOf(REC_KEYS) !== r0, fieldsChanged = snapOf(FIELD_KEYS) !== f0;
      if (recChanged) return commit("all");
      if (!fieldsChanged) {
        if (f.done) S.done[occ.key] = 1; else delete S.done[occ.key];
        close(); changed(); return;
      }
      f.asking = true;
      draw();
    }

    function commit(scope) {
      const title = f.title.trim() || catOf(f.cat).name;
      const fields = {
        title,
        cat: f.cat,
        start: f.start,
        end: f.end,
        loc: f.loc ? f.loc.trim() : "",
        note: f.note.trim(),
        reminder: { enabled: f.remindEnabled, mins: f.remindMins }
      };
      const recDef = { days: [...f.days], every: f.every, from: f.from, until: f.until || null };
      let key = null;

      if (isNew) {
        const ev = { id: uid(), ...fields };
        if (f.repeat) ev.rec = recDef;
        else { ev.rec = null; ev.date = f.date; }
        S.events.push(ev);
      } else if (!isRec) {
        if (f.repeat) {
          base.rec = recDef;
          delete base.date;
          Object.assign(base, fields);
          key = base.id + "@" + f.date;
        } else {
          Object.assign(base, fields, { date: f.date });
          if (f.date !== date) {
            const ok = base.id + "@" + date, nk = base.id + "@" + f.date;
            if (S.done[ok]) { S.done[nk] = S.done[ok]; delete S.done[ok]; }
          }
          key = base.id + "@" + f.date;
        }
      } else if (scope === "this") {
        const diff = {};
        for (const k of Object.keys(fields)) {
          const vA = typeof fields[k] === "object" && fields[k] !== null ? JSON.stringify(fields[k]) : (fields[k] || "");
          const vB = typeof base[k] === "object" && base[k] !== null ? JSON.stringify(base[k]) : (base[k] || "");
          if (vA !== vB) diff[k] = fields[k];
        }
        if (Object.keys(diff).length) S.ov[occ.key] = diff;
        else delete S.ov[occ.key];
        key = occ.key;
      } else if (scope === "all") {
        Object.assign(base, fields);
        base.rec = recDef;
        key = occ.key;
      } else {
        if (f.date <= base.rec.from) {
          Object.assign(base, fields);
          base.rec = recDef;
          key = occ.key;
        } else {
          const ne = splitSeries(base, f.date);
          Object.assign(ne, fields);
          ne.rec = { ...recDef, from: f.date };
          key = ne.id + "@" + f.date;
        }
      }

      if (key) {
        if (f.done) S.done[key] = 1;
        else delete S.done[key];
      }
      close();
      changed();
      buzz(8);
      snack(isNew ? "Eveniment adăugat" : scope === "this" && isRec ? "Salvat doar pentru " + shortDate(f.date) : "Modificări salvate");
    }

    draw();
    const t = $("#f-title", box);
    if (t && isNew && !isSmall()) t.focus();
  }, "full");
}

/* ==========================================================================
   SWIPE BETWEEN PERIODS (week / month / day)
   ========================================================================== */
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let touchStartScrollLeft = 0;
let isTouchActive = false;

window.addEventListener("touchstart", e => {
  if (!e.touches || e.touches.length !== 1 || !["week", "month", "day"].includes(ui.view)) { isTouchActive = false; return; }
  if (document.querySelector(".ov") || activePicker) { isTouchActive = false; return; }
  const target = e.target;
  // Rows own horizontal swipes (done / cancel); form controls and wheels own their gestures.
  if (target.closest("input, textarea, select, .swipe, .wheel, .tabs")) { isTouchActive = false; return; }
  if (!target.closest("#main, .top, #pbar")) { isTouchActive = false; return; }
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchStartTime = Date.now();
  const gw = document.querySelector(".gw");
  touchStartScrollLeft = gw ? gw.scrollLeft : 0;
  isTouchActive = true;
}, { passive: true });

window.addEventListener("touchend", e => {
  if (!isTouchActive) return;
  isTouchActive = false;
  if (!e.changedTouches || e.changedTouches.length === 0) return;
  if (document.querySelector(".ov") || activePicker) return;

  const touch = e.changedTouches[0];
  const deltaX = touch.clientX - touchStartX;
  const deltaY = touch.clientY - touchStartY;
  const elapsed = Date.now() - touchStartTime;
  if (elapsed > 650) return;
  if (Math.abs(deltaX) < 42) return;
  if (Math.abs(deltaX) <= Math.abs(deltaY) * 1.3) return;

  const inNav = e.target.closest(".top, #pbar, .totals, .corner, .dh");
  const gw = document.querySelector(".gw");
  if (!inNav && gw && gw.scrollWidth > gw.clientWidth + 20) {
    if (deltaX < 0) {
      if (touchStartScrollLeft + gw.clientWidth < gw.scrollWidth - 32) return;
    } else if (touchStartScrollLeft > 32) return;
  }
  nav(deltaX < 0 ? 1 : -1);
}, { passive: true });

let resizeTimer = null;
let wasSmall = isSmall();
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (isSmall() !== wasSmall) { wasSmall = isSmall(); $("#main").dataset.v = ""; }
    render();
  }, 150);
});
darkMQ.addEventListener("change", () => applyTheme(getTheme()));

// Countdown / now-line: re-render on each minute boundary and when the app comes back to the foreground.
function tick() {
  setTimeout(() => {
    if (!dragging && ui.view !== "settings") render();
    tick();
  }, 60000 - (Date.now() % 60000) + 250);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && ui.view !== "settings") render(); });

// Initial boot
applyTheme(getTheme());
render();
tick();
if (ghToken) loadFromGitHub();
else setStatus("local");

// Background sync every 60s
setInterval(() => {
  if (ghToken && !dirty && !saving) loadFromGitHub();
}, 60000);

})();
</script>
</body>
</html>
